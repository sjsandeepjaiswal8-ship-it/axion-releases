<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141c30"/>
      <stop offset="55%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>

    <!-- Left Cyan Blade Gradient -->
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55ffff"/>
      <stop offset="35%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Right Violet Blade Gradient -->
    <linearGradient id="violetBlade" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="45%" stop-color="#b5179e"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>

    <!-- Center Precision Laser Beam -->
    <linearGradient id="laserBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f5ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#f72585" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0"/>
    </linearGradient>

    <!-- Metallic Edge Highlight -->
    <linearGradient id="metalEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#80b3ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGlow)"/>

  <!-- Subtle Precision Calibration Grid & Circles -->
  <circle cx="512" cy="440" r="340" fill="none" stroke="#00f5ff" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="512" cy="440" r="280" fill="none" stroke="#7209b7" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="512" cy="440" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="2 12"/>

  <!-- Outer Precision Crosshair Ticks -->
  <line x1="512" y1="90" x2="512" y2="120" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="512" y1="760" x2="512" y2="790" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="162" y1="440" x2="192" y2="440" stroke="#f72585" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="832" y1="440" x2="862" y2="440" stroke="#f72585" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Core AXION "A" Monogram Group -->
  <g id="axionSymbol" transform="translate(0, -20)">
    <!-- Ambient Underglow -->
    <ellipse cx="512" cy="460" rx="160" ry="200" fill="#00d4ff" fill-opacity="0.15" filter="url(#ambientCoreGlow)"/>
    <ellipse cx="512" cy="460" rx="140" ry="180" fill="#b5179e" fill-opacity="0.12" filter="url(#ambientCoreGlow)"/>

    <!-- Left Cyan Precision Blade -->
    <polygon points="512,180 340,580 395,580 512,280 629,580 684,580" fill="none"/>
    <path d="M 512,180 L 320,620 L 400,620 L 512,340 Z" fill="url(#cyanBlade)"/>
    <!-- Left Blade Specular Edge -->
    <path d="M 512,180 L 320,620 L 330,620 L 512,195 Z" fill="url(#metalEdge)"/>

    <!-- Right Violet Precision Blade -->
    <path d="M 512,180 L 704,620 L 624,620 L 512,340 Z" fill="url(#violetBlade)"/>
    <!-- Right Blade Specular Edge -->
    <path d="M 512,180 L 704,620 L 694,620 L 512,195 Z" fill="#ffffff" fill-opacity="0.7"/>

    <!-- Apex Precision Diamond / Prism Nucleus -->
    <polygon points="512,170 535,210 512,250 489,210" fill="#ffffff" filter="url(#laserGlow)"/>

    <!-- The Invisible Force: Floating Horizontal Precision Laser Beam -->
    <g filter="url(#laserGlow)">
      <!-- Wide Energy Field -->
      <polygon points="260,490 764,490 740,502 284,502" fill="url(#laserBeam)" fill-opacity="0.8"/>
      <!-- Pure White Quantum Core Beam -->
      <line x1="240" y1="496" x2="784" y2="496" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <!-- Core Focal Pulse Points -->
      <circle cx="430" cy="496" r="4.5" fill="#00f5ff"/>
      <circle cx="512" cy="496" r="6" fill="#ffffff"/>
      <circle cx="594" cy="496" r="4.5" fill="#f72585"/>
    </g>

    <!-- Lower Inverted Force Reflection (Negative Space Dynamic) -->
    <polygon points="512,540 460,620 564,620" fill="#060912" stroke="#00f5ff" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <!-- Typography: AXION -->
  <text x="512" y="785" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Inter', sans-serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="24" 
        fill="#ffffff">AXION</text>

  <!-- Subtitle Tagline: THE INVISIBLE FORCE OF PRECISION -->
  <text x="512" y="835" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" 
        font-size="20" 
        font-weight="600" 
        letter-spacing="8" 
        fill="#00d4ff" 
        fill-opacity="0.9">THE INVISIBLE FORCE OF PRECISION</text>

  <!-- Bottom Sub-Caliber Dots -->
  <circle cx="432" cy="875" r="2.5" fill="#00f5ff" fill-opacity="0.6"/>
  <circle cx="512" cy="875" r="3" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="592" cy="875" r="2.5" fill="#f72585" fill-opacity="0.6"/>
</svg>
